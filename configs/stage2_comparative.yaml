# Stage 2 — comparative concept operator
# Concept #3 (replacement). Tests whether uni-axial concepts work
# generally — the architecture's sweet spot.

stage1_ckpt: checkpoints/stage1/final.pt

gte_name:    thenlper/gte-base
clip_name:   openai/clip-vit-base-patch32
vjepa_name:  facebook/vjepa2-vitl-fpc16-256-ssv2

# --- Training ---
epochs:        1500
lr:            0.001
weight_decay:  0.0

# --- Loss weights ---
w_forward:  1.0
w_inverse:  1.0
w_xmodal:   1.0     # auto-skipped when no image pairs

# --- Logging / output ---
log_every:    50
concept_name: comparative
out_dir:      checkpoints/stage2_comparative
device:       cuda
seed:         0
