# Stage 2 — plurality concept operator
# Reference: /Users/chintu/.claude/plans/you-are-a-senior-jazzy-shannon.md sec. 2

# --- Stage-1 checkpoint ---
stage1_ckpt: checkpoints/stage1/final.pt

# --- Foundation model names (must match Stage 1) ---
gte_name:    thenlper/gte-base
clip_name:   openai/clip-vit-base-patch32
vjepa_name:  facebook/vjepa2-vitl-fpc16-256-ssv2

# --- Training ---
epochs:        1500
lr:            0.001
weight_decay:  0.0

# --- Loss weights ---
w_forward:  1.0
w_inverse:  1.0
w_xmodal:   1.0     # cross-modal consistency: visual plural shift ≈ text plural shift

# --- Logging / output ---
log_every:    50
concept_name: plural
out_dir:      checkpoints/stage2_plurality
device:       cuda
seed:         0
