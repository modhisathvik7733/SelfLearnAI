# Stage 1 — star-topology adapter alignment
# Reference: /Users/chintu/.claude/plans/you-are-a-senior-jazzy-shannon.md sec. 2

# --- Data ---
coco_root: /data/coco               # CHANGE: path to your COCO root on the GPU box
coco_split: val2017                 # use val2017 for the curated subset; train2017 for fuller
max_samples: 30000                  # ~6K images × 5 captions ≈ 30K samples

# --- Foundation model names ---
gte_name:    thenlper/gte-base
clip_name:   openai/clip-vit-base-patch32
vjepa_name:  facebook/vjepa2-vitl-fpc16-256-ssv2

# --- Training ---
# Defaults sized for a 24-32 GB GPU (RTX 4090 / 5090 / A100).
# For a smaller GPU (8-12 GB), drop batch_size to 64.
steps:                 10000          # cache mode is fast (~2 min/5k steps on RTX 5090)
batch_size:             256           # 4x bump; 5090 has 32GB, was using 4GB at bs=64
lr:                     0.0002        # linear-scaled with batch (sqrt-rule, half-strength)
weight_decay:           0.01
grad_clip:              1.0
temperature:            0.07
hard_negatives_per_modality: 64
memory_bank_size:       8192          # bigger bank for the bigger batch
min_categories:         4
min_count_levels:       3

# --- Loss weights (locked: only InfoNCE + VICReg in Stage 1) ---
w_align_text:    1.0
w_align_vision:  1.0
w_vicreg_text:   1.0
w_vicreg_vision: 1.0
w_vicreg_anchor: 1.0                  # only used if freeze_anchor: false
vicreg_proj_dim: 768

# --- Anchor policy ---
# True = adapter_c frozen at init; text/vision adapters distill into a fixed
#        random projection of CLIP space. Default; no anchor drift possible.
# False = adapter_c trains under VICReg only. Empirically drifts even with
#         small lr; only set False if you really know why.
freeze_anchor: true

# --- Cached features ---
# If non-empty, skip foundation forward passes and read precomputed
# (gte, clip_text, clip_vision, vjepa_patches) tensors from this directory.
# Generate with: scripts/precompute_features.py
# This is the recommended path — turns ~3s/step (image-loading bottleneck)
# into ~50ms/step (tensor slice + adapter MLP).
# Empty string = live encoding (slower, useful for ad-hoc inputs).
cache_dir: ""

# --- Logging / output ---
log_every:    50
ckpt_every:   500
out_dir:      checkpoints/stage1
device:       cuda
seed:         0
