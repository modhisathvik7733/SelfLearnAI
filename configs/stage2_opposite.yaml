# Stage 2 — opposite/antonym concept operator
# Concept #3 in the library. Tests whether the architecture handles
# purely-semantic concepts (no morphology) with high cross-pair coherence.

# --- Stage-1 checkpoint (shared across all concepts) ---
stage1_ckpt: checkpoints/stage1/final.pt

# --- Foundation model names (must match Stage 1) ---
gte_name:    thenlper/gte-base
clip_name:   openai/clip-vit-base-patch32
vjepa_name:  facebook/vjepa2-vitl-fpc16-256-ssv2

# --- Training ---
epochs:        1500
lr:            0.001
weight_decay:  0.0

# --- Loss weights ---
w_forward:  1.0
w_inverse:  1.0
w_xmodal:   1.0     # auto-skipped when no image pairs

# --- Logging / output ---
log_every:    50
concept_name: opposite
out_dir:      checkpoints/stage2_opposite
device:       cuda
seed:         0
